<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 10px;
      font-family: Arial, sans-serif;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h3>Lovable Extension</h3>
  <button id="activateBtn">Activate Code</button>
  <script>
    document.getElementById("activateBtn").addEventListener("click", function() {
      // Send message to extension
      chrome.runtime.sendMessage({action: "activateCode"});
    });
  </script>
</body>
</html>
